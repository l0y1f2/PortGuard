<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PortGuard · 端口进程管家</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 2 4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6l-8-4z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">PortGuard</div>
        <div class="brand-sub">端口 · 进程 · 服务</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="overview">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>总览</span>
      </button>
      <button class="nav-item" data-view="ports">
        <svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2.2"/><circle cx="15" cy="16" r="2.2"/></svg>
        <span>端口</span><em class="nav-badge" id="badge-ports"></em>
      </button>
      <button class="nav-item" data-view="processes">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>
        <span>进程</span><em class="nav-badge" id="badge-procs"></em>
      </button>
      <button class="nav-item" data-view="services">
        <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.9 7l2.1 2.1M17 14.9l2.1 2.1M3 12h3M18 12h3M4.9 17l2.1-2.1M17 9.1l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>
        <span>服务</span>
      </button>
      <button class="nav-item" data-view="registry">
        <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
        <span>端口台账</span><em class="nav-badge" id="badge-reg"></em>
      </button>
      <button class="nav-item" data-view="firewall">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 10h16M4 14h16M10 6v4M14 10v4M8 14v4"/></svg>
        <span>防火墙</span>
      </button>
    </nav>

    <div class="side-foot">
      <div class="stat-mini">
        <span>采集引擎</span><b id="foot-engine">—</b>
      </div>
      <div class="stat-mini">
        <span>权限</span><b id="foot-admin">—</b>
      </div>
      <div class="stat-mini">
        <span>更新于</span><b id="foot-time">—</b>
      </div>
      <button class="about-btn" id="btn-about" title="关于 PortGuard">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        <span>关于 PortGuard</span>
      </button>
    </div>
  </aside>

  <!-- 主体 -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">总览</h1>
        <p id="view-desc">这台电脑上正在监听的端口、跑着的服务，一眼看清</p>
      </div>
      <div class="topbar-tools">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="search" type="search" placeholder="搜索端口 / 进程 / 项目 / 服务…" autocomplete="off">
        </div>
        <label class="switch-wrap" title="自动刷新">
          <input type="checkbox" id="auto-refresh" checked>
          <span class="switch"></span>
          <span class="switch-label">自动</span>
        </label>
        <button class="btn btn-primary" id="btn-refresh">
          <svg viewBox="0 0 24 24" class="ico-refresh"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg>
          刷新
        </button>
      </div>
    </header>

    <div class="banner" id="admin-banner" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <div>
        <b>当前不是管理员权限</b>
        <span>可以查看全部端口与进程，但结束系统进程、封禁端口会失败。请用「以管理员身份启动.bat」重新打开。</span>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="this.parentElement.hidden=true">知道了</button>
    </div>

    <div class="content" id="content"><div class="loading">正在读取系统信息…</div></div>
  </main>
</div>

<!-- 详情抽屉 -->
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-title" id="drawer-title">进程详情</div>
      <div class="drawer-sub" id="drawer-sub"></div>
    </div>
    <button class="icon-btn" id="drawer-close" title="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<!-- 弹窗 -->
<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal">
    <div class="modal-icon" id="modal-icon"></div>
    <h3 id="modal-title">标题</h3>
    <div class="modal-text" id="modal-text"></div>
    <div class="modal-form" id="modal-form"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
